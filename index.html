    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // FIREBASE CONFIG BÉ XÍU
        const firebaseConfig = {
            apiKey: "AIzaSyCQczIrVe39Hs2d1bCt4OUgnOHK8NJFBq8",
            authDomain: "tiemgiaybexiu-c532a.firebaseapp.com",
            projectId: "tiemgiaybexiu-c532a",
            storageBucket: "tiemgiaybexiu-c532a.firebasestorage.app",
            messagingSenderId: "499321303408",
            appId: "1:499321303408:web:141656acab5eaf5ad95fb5"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allProducts = [];
        window.currentGenderTab = 'new'; // Mặc định mở web là MỚI VỀ
        window.currentFilter = 'all';        

        // Lắng nghe sự kiện cuộn trang để hiện nút Back to Top
        window.addEventListener('scroll', () => {
            const btn = document.getElementById('backToTopBtn');
            if(btn) {
                if (window.scrollY > 300) {
                    btn.classList.remove('opacity-0', 'pointer-events-none');
                    btn.classList.add('opacity-100', 'pointer-events-auto');
                } else {
                    btn.classList.add('opacity-0', 'pointer-events-none');
                    btn.classList.remove('opacity-100', 'pointer-events-auto');
                }
            }
        });

        window.showToast = function(message) {
            const toast = document.getElementById("toast");
            document.getElementById("toastMsg").innerText = message;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3500);
        }

        window.switchTab = function(tabName) {
            window.currentGenderTab = tabName;
            
            const tabs = ['new', 'small', 'large'];
            const activeClass = "flex-1 py-2 px-1 sm:px-2 text-[10px] sm:text-xs font-bold rounded-xl bg-black text-white shadow-sm transition-all text-center";
            const inactiveClass = "flex-1 py-2 px-1 sm:px-2 text-[10px] sm:text-xs font-bold rounded-xl text-gray-500 hover:text-gray-800 transition-all text-center";

            tabs.forEach(t => {
                document.getElementById('tab-' + t).className = (t === tabName) ? activeClass : inactiveClass;
            });

            if (tabName === 'new') {
                window.currentFilter = 'all';
                document.getElementById('storyFiltersContainer').style.display = 'none'; // Ẩn vòng tròn size
            } else if (tabName === 'small') {
                window.currentFilter = '37'; 
                document.getElementById('storyFiltersContainer').style.display = 'block'; // Hiện vòng tròn size
            } else {
                window.currentFilter = '40'; 
                document.getElementById('storyFiltersContainer').style.display = 'block';
            }
            
            window.renderFilters();
            window.renderProducts();
        }

        window.renderFilters = function() {
            const container = document.getElementById('storyFilters');
            if (!container || window.currentGenderTab === 'new') return; // Không render khi ở tab Mới Về
            let html = '';
            
            const smallSizes = ['kid', '33', '34', '35', '36', '36.5', '37', '38', '39'];
            const largeSizes = ['40', '41', '42', '43', '44', '45'];
            const activeSizes = (window.currentGenderTab === 'small') ? smallSizes : largeSizes;
            
            activeSizes.forEach(size => {
                let display = size === 'kid' ? 'KID' : size;
                let isActive = window.currentFilter === size;
                let ringClass = isActive ? "story-ring-active shadow-sm" : "story-ring-inactive hover:border-gray-400";
                let innerClass = isActive ? "bg-white text-gray-900 font-bold" : "bg-white text-gray-600 font-medium hover:bg-gray-50";
                
                html += `
                    <div class="flex flex-col items-center cursor-pointer min-w-[48px] sm:min-w-[54px]" onclick="applyFilter('${size}')">
                        <div class="${ringClass} transition-all">
                            <div class="w-[44px] h-[44px] sm:w-[50px] sm:h-[50px] ${innerClass} rounded-full flex items-center justify-center text-[12px] sm:text-[13px] transition-colors">
                                ${display}
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        };

        window.applyFilter = function(size) {
            window.currentFilter = size;
            window.renderFilters();
            window.renderProducts();
        };

        const parseTimestamp = (val) => {
            if (!val) return 0;
            if (typeof val.toMillis === 'function') return val.toMillis();
            if (val.seconds) return val.seconds * 1000;
            if (val instanceof Date) return val.getTime();
            if (typeof val === 'number') return val;
            return new Date(val).getTime() || 0;
        };

        onSnapshot(collection(db, "products"), (snapshot) => {
            allProducts = [];
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                if (data.status === 'available' || !data.status || !data.isSold) {
                    const imgUrl = data.imageUrl || (data.images && data.images[0]) || '';
                    if(imgUrl && imgUrl.startsWith('http')) {
                        allProducts.push({ id: docSnap.id, ...data, imageUrl: imgUrl });
                    }
                }
            });

            allProducts.sort((a, b) => {
                const timeA = parseTimestamp(a.createdAt);
                const timeB = parseTimestamp(b.createdAt);
                return timeB - timeA;
            });

            const totalEl = document.getElementById('totalShoes');
            if (totalEl) totalEl.innerText = allProducts.length;
            window.renderProducts();
        }, (error) => {
            const container = document.getElementById('productGrid');
            if (container) {
                container.innerHTML = `<div class="col-span-full text-center py-16 text-gray-500">Lỗi kết nối CSDL. Vui lòng tải lại trang.</div>`;
            }
        });

        window.getOptimizedImageUrl = function(url, width = 600) {
            if (!url) return '';
            if (url.includes('ik.imagekit.io') && !url.includes('tr=')) return `${url}?tr=w-${width},f-webp,q-85`;
            return url;
        };

        window.renderProducts = function() {
            const container = document.getElementById('productGrid');
            if (!container) return;
            container.innerHTML = '';
            
            let filtered = [];
            if (window.currentGenderTab === 'new') {
                // Tab mới về: Lấy 40 đôi đầu tiên (mới nhất), bỏ qua filter size
                filtered = allProducts.slice(0, 40);
            } else {
                // Các tab khác: Filter theo size
                filtered = allProducts.filter(p => {
                    let pSize = (p.size || '').toString().toLowerCase();
                    let cFilter = window.currentFilter.toString().toLowerCase();
                    if (cFilter === '36') return pSize === '36';
                    if (cFilter === '36.5') return pSize === '36.5';
                    return pSize.includes(cFilter);
                });
            }

            if(filtered.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-20 text-ig-gray"><i class="fas fa-camera text-4xl mb-3 opacity-20"></i><br>Chưa có giày ở mục này</div>`;
                return;
            }

            filtered.forEach(p => {
                const div = document.createElement('div');
                div.className = "cursor-pointer group flex flex-col bg-white rounded-xl border border-gray-100 overflow-hidden shadow-sm hover:shadow-md transition-all";
                div.onclick = () => window.openModal(p);
                
                // Nhãn "NEW" ở góc nếu ở tab Mới Về
                const newBadge = window.currentGenderTab === 'new' ? `<div class="absolute top-2 left-2 bg-black/75 backdrop-blur-sm text-white text-[10px] font-bold px-2 py-0.5 rounded-full z-10">MỚI</div>` : '';

                div.innerHTML = `
                    <div class="w-full relative overflow-hidden bg-gray-50 flex-1 flex items-center justify-center">
                        ${newBadge}
                        <img src="${window.getOptimizedImageUrl(p.imageUrl, 500)}" loading="lazy" class="w-full h-auto max-h-[300px] object-cover group-hover:scale-[1.02] transition-transform duration-300" alt="Giày">
                    </div>
                    <div class="p-2.5 sm:p-3 bg-white">
                        <div class="text-[11px] font-medium text-gray-500 mb-0.5">Size ${p.size || ''}</div>
                        <div class="font-bold text-sm sm:text-[15px] text-gray-900">${(Number(p.price) || 0).toLocaleString('vi-VN')}đ</div>
                    </div>
                `;
                container.appendChild(div);
            });
        };

        let currentItem = null;
        window.openModal = function(item) {
            currentItem = item;
            document.getElementById('modalImg').src = window.getOptimizedImageUrl(item.imageUrl, 1000);
            document.getElementById('modalSize').innerText = item.size || '';
            document.getElementById('modalPrice').innerText = (Number(item.price) || 0).toLocaleString('vi-VN') + 'đ';
            
            let cmText = "~ Vừa vặn";
            let sNum = parseFloat(item.size);
            if(!isNaN(sNum)) {
                if(sNum === 33 || sNum === 33.5) cmText = "~ 20.5cm - 21cm";
                else if(sNum === 34 || sNum === 34.5) cmText = "~ 21.5cm - 22cm";
                else if(sNum === 35 || sNum === 35.5) cmText = "~ 22cm - 22.5cm";
                else if(sNum === 36) cmText = "~ 22.5cm - 23cm";
                else if(sNum === 36.5 || sNum === 37) cmText = "~ 23cm - 23.5cm";
                else if(sNum >= 37.5 && sNum <= 39) cmText = "~ 24cm - 25cm";
                else if(sNum >= 40 && sNum <= 41) cmText = "~ 25.5cm - 26cm";
                else if(sNum >= 42 && sNum <= 43) cmText = "~ 26.5cm - 27.5cm";
                else if(sNum >= 44) cmText = "~ 28cm+";
            } else if((item.size || '').toLowerCase() === 'kid') {
                cmText = "Size bé < 20cm";
            }
            document.getElementById('modalCmInfo').innerText = cmText;
            
            document.getElementById('orderModal').classList.remove('hidden');
        };

        window.closeModal = function() {
            document.getElementById('orderModal').classList.add('hidden');
        };

        window.submitOrder = async function() {
            const phoneInput = document.getElementById('customerPhone');
            const phone = phoneInput ? phoneInput.value.trim() : '';
            const btn = document.getElementById('btnSubmitOrder');

            if (!phone) { window.showToast('Vui lòng nhập SĐT để Shop liên hệ!'); return; }
            if (!currentItem) { window.showToast('Chưa chọn sản phẩm!'); return; }

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            btn.disabled = true;

            const telegramBotToken = "8968912621:AAFKK2PQuPNqWLLer4_wkZf6PtY1ZzHV9RI";
            const chatId = "8511070091";
            
            const message = `🔥 YÊU CẦU TỪ WEB 🔥\n\n` +
                            `📞 SĐT: ${phone}\n` +
                            `👟 Size: ${currentItem.size || '---'}\n` +
                            `💰 Giá: ${(Number(currentItem.price) || 0).toLocaleString('vi-VN')}đ\n` +
                            `🖼 Ảnh: ${currentItem.imageUrl}\n\n` +
                            `🔗 Nhắn Zalo: https://zalo.me/${phone}`;

            try {
                await addDoc(collection(db, "orders"), {
                    size: currentItem.size || '',
                    price: Number(currentItem.price) || 0,
                    imageUrl: currentItem.imageUrl,
                    customerName: "Khách web",
                    customerPhone: phone,
                    timestamp: serverTimestamp(),
                    status: 'pending'
                });

                try {
                    await fetch(`https://api.telegram.org/bot${telegramBotToken}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_id: chatId, text: message, parse_mode: 'HTML' })
                    });
                } catch (tgErr) {
                    console.warn("Lỗi gửi thông báo Telegram:", tgErr);
                }

                window.showToast("Gửi thành công! Shop sẽ liên hệ bạn ngay.");
                window.closeModal();
                if (phoneInput) phoneInput.value = '';
            } catch (err) {
                console.error("Lỗi gửi đơn:", err);
                window.showToast("Lỗi mạng. Vui lòng thử lại hoặc nhắn tin trực tiếp!");
            } finally {
                btn.innerHTML = 'Gửi';
                btn.disabled = false;
            }
        };
        
        // Khởi chạy
        window.switchTab('new');
    </script>
</body>
</html>
