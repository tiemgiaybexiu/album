<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tiệm giày Bé Xíu - Giày 2hand</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { ig: { text: '#262626', link: '#00376b', border: '#dbdbdb', gray: '#8e8e8e', bg: '#fafafa' } }
                }
            }
        }
    </script>

    <style>
        body { background-color: #fafafa; color: #262626; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .story-ring-active {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            padding: 2.5px; border-radius: 50%;
        }
        .story-ring-inactive { background: #dbdbdb; padding: 1.5px; border-radius: 50%; }

        #toast {
            visibility: hidden; min-width: 250px; background-color: #262626; color: #fff;
            text-align: center; border-radius: 8px; padding: 12px 20px; position: fixed;
            z-index: 9999; left: 50%; transform: translateX(-50%); top: 30px; font-size: 13px; font-weight: 600;
            box-shadow: 0px 8px 24px rgba(0,0,0,0.15); opacity: 0; transition: opacity 0.3s, top 0.3s;
        }
        #toast.show { visibility: visible; top: 50px; opacity: 1; }
    </style>
</head>
<body class="pb-20">

    <!-- Header Hồ sơ Instagram -->
    <header class="bg-white pt-6 pb-4 px-4 border-b border-ig-border relative">
        <a href="https://tiemgiaybexiu.github.io/admin/" class="absolute top-4 right-4 text-ig-gray hover:text-black transition">
            <i class="fas fa-bars text-xl"></i>
        </a>

        <div class="max-w-2xl mx-auto flex flex-col md:flex-row items-center gap-5 md:gap-8">
            <div class="story-ring-active shrink-0">
                <div class="w-20 h-20 md:w-28 md:h-28 rounded-full bg-white p-0.5 relative">
                    <img src="https://i.ibb.co/svCGqf0w/Gemini-Generated-Image-5b2r4l5b2r4l5b2r.png" alt="Avatar" class="w-full h-full rounded-full object-cover">
                </div>
            </div>
            
            <div class="flex flex-col items-center md:items-start flex-1 w-full">
                <div class="flex items-center gap-2 mb-3">
                    <h1 class="text-xl font-bold tracking-tight">tiemgiay.bexiu</h1>
                    <i class="fas fa-certificate text-blue-500 text-sm" title="Đã xác minh"></i>
                </div>
                
                <div class="flex gap-6 mb-3 text-sm">
                    <div class="text-center md:text-left"><span class="font-bold text-base" id="totalShoes">0</span><br><span class="text-ig-gray">giày sẵn có</span></div>
                    <div class="text-center md:text-left"><span class="font-bold text-base">100%</span><br><span class="text-ig-gray">chính hãng</span></div>
                </div>
                
                <div class="text-sm font-medium mb-4 text-center md:text-left">
                    <p class="font-bold">Giày 2hand Nữ & Học sinh</p>
                    <p class="text-ig-gray text-xs mt-0.5">📍 117 Phạm Ngũ Lão, Thủ Dầu Một, Bình Dương</p>
                </div>
                
                <div class="flex gap-2 w-full max-w-sm justify-center md:justify-start">
                    <!-- SĐT MỚI: 0378 155 320 -->
                    <a href="https://zalo.me/0378155320" target="_blank" class="flex-1 bg-gray-100 hover:bg-gray-200 text-center font-semibold text-[13px] py-1.5 rounded-lg transition-colors">Nhắn Zalo</a>
                    <a href="https://www.facebook.com/profile.php?id=61595679246797" target="_blank" class="flex-1 bg-gray-100 hover:bg-gray-200 text-center font-semibold text-[13px] py-1.5 rounded-lg transition-colors">Facebook Tiệm</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Khu vực Lọc Size & Tab -->
    <div class="bg-white/95 backdrop-blur-md sticky top-0 z-40 border-b border-ig-border shadow-sm">
        <div class="max-w-4xl mx-auto px-3 pt-3 pb-1">
            
            <div class="max-w-md mx-auto bg-gray-100 p-1.5 rounded-2xl flex gap-1.5 shadow-inner border border-gray-200">
                <button onclick="switchTab('small')" id="tab-small" class="flex-1 py-2.5 px-3 rounded-xl font-black text-xs sm:text-sm text-center transition-all bg-black text-white shadow-md flex items-center justify-center gap-1.5">
                    <span>👟 SIZE NHỎ</span>
                    <span class="text-[10px] sm:text-xs font-semibold opacity-85">(Kid - 39)</span>
                </button>
                <button onclick="switchTab('large')" id="tab-large" class="flex-1 py-2.5 px-3 rounded-xl font-extrabold text-xs sm:text-sm text-center transition-all text-gray-500 hover:text-black flex items-center justify-center gap-1.5">
                    <span>👟 SIZE LỚN</span>
                    <span class="text-[10px] sm:text-xs font-semibold opacity-85">(40 - 45)</span>
                </button>
            </div>

            <div class="py-4 px-2">
                <div class="flex flex-wrap justify-center gap-4" id="storyFilters">
                    <!-- JS render Story Rings -->
                </div>
            </div>
            
        </div>
    </div>

    <!-- Lưới Sản Phẩm -->
    <main class="max-w-4xl mx-auto px-1 pt-1">
        <!-- Bỏ aspect ratio cố định, cho ảnh tự do giãn chiều cao (h-auto) -->
        <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 gap-1.5 sm:gap-2">
            <div class="col-span-full text-center py-20 text-ig-gray">
                <i class="fas fa-circle-notch fa-spin text-2xl mb-2"></i>
                <p class="text-sm">Đang tải kệ giày...</p>
            </div>
        </div>
    </main>

    <!-- Modal Unified Card Chốt Đơn Tối Giản -->
    <div id="orderModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4 transition-opacity">
        <div class="bg-white w-full max-w-md max-h-[90vh] overflow-y-auto rounded-2xl no-scrollbar shadow-2xl relative flex flex-col">
            
            <button onclick="closeModal()" class="absolute top-3 right-3 bg-black/50 backdrop-blur-md text-white w-8 h-8 rounded-full flex items-center justify-center z-20 hover:bg-black/70 transition">
                <i class="fas fa-times"></i>
            </button>
            
            <!-- Phần hiển thị ảnh tỷ lệ thực, ko crop vuông -->
            <div class="w-full bg-gray-100 flex items-center justify-center min-h-[250px] max-h-[60vh] overflow-hidden">
                <img id="modalImg" src="" alt="Giày" class="w-full h-full object-contain">
            </div>
            
            <div class="p-5 bg-white">
                <div class="mb-3">
                    <div class="flex justify-between items-baseline">
                        <h2 class="text-xl font-bold tracking-tight text-black" id="modalPrice"></h2>
                        <div class="text-xs text-ig-gray font-medium">
                            <span class="text-black font-semibold">Size <span id="modalSize"></span></span> • <span id="modalCmInfo"></span>
                        </div>
                    </div>
                </div>

                <div class="mb-4 pt-3 border-t border-gray-100">
                    <p class="text-xs text-gray-500 font-medium mb-2 flex items-center gap-1.5">
                        <i class="fas fa-camera text-gray-400"></i> Xin thêm ảnh:
                    </p>
                    <div class="grid grid-cols-2 gap-2">
                        <a href="https://zalo.me/0378155320" target="_blank" class="py-2.5 px-3 rounded-xl bg-blue-50 hover:bg-blue-100 text-blue-600 font-bold text-xs flex items-center justify-center gap-1.5 transition text-center shadow-sm">
                            <i class="fas fa-comment-dots text-sm"></i> Nhắn tin Zalo
                        </a>
                        <a href="https://www.facebook.com/profile.php?id=61595679246797" target="_blank" class="py-2.5 px-3 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold text-xs flex items-center justify-center gap-1.5 transition text-center shadow-sm">
                            <i class="fab fa-facebook-messenger text-sm"></i> Nhắn tin Facebook
                        </a>
                    </div>
                </div>
                
                <div class="relative">
                    <input type="tel" id="customerPhone" placeholder="Nhập SĐT để Shop tư vấn/chốt đơn..." class="w-full bg-gray-50 border border-ig-border rounded-xl pl-4 pr-[80px] py-3 text-sm focus:outline-none focus:border-gray-400 transition-colors">
                    <button id="btnSubmitOrder" onclick="submitOrder()" class="absolute right-1 top-1 bottom-1 bg-black text-white font-semibold px-4 rounded-lg hover:bg-gray-800 transition text-xs">
                        Gửi
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center py-10 mt-10"></div>
    <div id="toast"><span></span> <span id="toastMsg"></span></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // FIREBASE CONFIG
        const fbP1 = "AIzaSyCVAm"; const fbP2 = "JO1KViXVg3"; const fbP3 = "kizelTp6CZ"; const fbP4 = "AFmJLkKiM";
        const firebaseConfig = {
            apiKey: fbP1 + fbP2 + fbP3 + fbP4,
            authDomain: "donggia-8ef8e.firebaseapp.com", 
            projectId: "donggia-8ef8e",
            storageBucket: "donggia-8ef8e.firebasestorage.app"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allProducts = [];
        window.currentGenderTab = 'small'; 
        window.currentFilter = '37';        

        window.showToast = function(message) {
            const toast = document.getElementById("toast");
            document.getElementById("toastMsg").innerText = message;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3500);
        }

        window.switchTab = function(tabName) {
            window.currentGenderTab = tabName;
            const btnSmall = document.getElementById('tab-small');
            const btnLarge = document.getElementById('tab-large');

            const activeClass = "flex-1 py-2.5 px-3 rounded-xl font-black text-xs sm:text-sm text-center transition-all bg-black text-white shadow-md flex items-center justify-center gap-1.5";
            const inactiveClass = "flex-1 py-2.5 px-3 rounded-xl font-extrabold text-xs sm:text-sm text-center transition-all text-gray-500 hover:text-black flex items-center justify-center gap-1.5";

            if (tabName === 'small') {
                btnSmall.className = activeClass;
                btnLarge.className = inactiveClass;
                window.currentFilter = '37'; 
            } else {
                btnLarge.className = activeClass;
                btnSmall.className = inactiveClass;
                window.currentFilter = '40'; 
            }
            window.renderFilters();
            window.renderProducts();
        }

        window.renderFilters = function() {
            const container = document.getElementById('storyFilters');
            if (!container) return;
            let html = '';
            
            const smallSizes = ['kid', '33', '34', '35', '36', '36.5', '37', '38', '39'];
            const largeSizes = ['40', '41', '42', '43', '44', '45'];
            const activeSizes = (window.currentGenderTab === 'small') ? smallSizes : largeSizes;
            
            activeSizes.forEach(size => {
                let display = size === 'kid' ? 'KID' : size;
                let isActive = window.currentFilter === size;
                let ringClass = isActive ? "story-ring-active" : "story-ring-inactive opacity-60 hover:opacity-100";
                
                html += `
                    <div class="flex flex-col items-center cursor-pointer min-w-[60px]" onclick="applyFilter('${size}')">
                        <div class="${ringClass} transition-opacity">
                            <div class="w-[56px] h-[56px] bg-white rounded-full flex items-center justify-center font-bold text-[13px] text-black">
                                ${display}
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        };

        window.applyFilter = function(size) {
            window.currentFilter = size;
            window.renderFilters();
            window.renderProducts();
        };

        const parseTimestamp = (val) => {
            if (!val) return 0;
            if (typeof val.toMillis === 'function') return val.toMillis();
            if (val.seconds) return val.seconds * 1000;
            if (val instanceof Date) return val.getTime();
            if (typeof val === 'number') return val;
            return new Date(val).getTime() || 0;
        };

        onSnapshot(collection(db, "products"), (snapshot) => {
            allProducts = [];
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                if (data.status === 'available' || !data.status || !data.isSold) {
                    const imgUrl = data.imageUrl || (data.images && data.images[0]) || '';
                    // Chỉ lấy những file up thành công có imageUrl
                    if(imgUrl && imgUrl.startsWith('http')) {
                        allProducts.push({ id: docSnap.id, ...data, imageUrl: imgUrl });
                    }
                }
            });

            allProducts.sort((a, b) => {
                const timeA = parseTimestamp(a.createdAt);
                const timeB = parseTimestamp(b.createdAt);
                return timeB - timeA;
            });

            const totalEl = document.getElementById('totalShoes');
            if (totalEl) totalEl.innerText = allProducts.length;
            window.renderProducts();
        }, (error) => {
            const container = document.getElementById('productGrid');
            if (container) {
                container.innerHTML = `<div class="col-span-full text-center py-16 text-gray-500">Lỗi kết nối CSDL. Vui lòng tải lại trang.</div>`;
            }
        });

        // Chỉ thêm param tối ưu WebP cho các link ImageKit
        window.getOptimizedImageUrl = function(url, width = 600) {
            if (!url) return '';
            if (url.includes('ik.imagekit.io') && !url.includes('tr=')) return `${url}?tr=w-${width},f-webp,q-85`;
            return url;
        };

        window.renderProducts = function() {
            const container = document.getElementById('productGrid');
            if (!container) return;
            container.innerHTML = '';
            
            let filtered = allProducts.filter(p => {
                let pSize = (p.size || '').toString().toLowerCase();
                let cFilter = window.currentFilter.toString().toLowerCase();
                if (cFilter === '36') return pSize === '36';
                if (cFilter === '36.5') return pSize === '36.5';
                return pSize.includes(cFilter);
            });

            if(filtered.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-20 text-ig-gray"><i class="fas fa-camera text-4xl mb-3 opacity-20"></i><br>Chưa có giày ở size này</div>`;
                return;
            }

            filtered.forEach(p => {
                const div = document.createElement('div');
                // Ảnh sẽ tự động co giãn theo tỉ lệ gốc nhờ w-full h-auto
                div.className = "cursor-pointer group flex flex-col bg-white border border-gray-100 overflow-hidden hover:shadow-sm transition-shadow rounded-md";
                div.onclick = () => window.openModal(p);
                div.innerHTML = `
                    <div class="w-full relative overflow-hidden bg-ig-bg flex-1 flex items-center justify-center">
                        <img src="${window.getOptimizedImageUrl(p.imageUrl, 500)}" loading="lazy" class="w-full h-auto max-h-[300px] object-cover group-hover:scale-105 transition-transform duration-500" alt="Giày">
                    </div>
                    <div class="p-2.5 flex flex-col gap-1 border-t border-gray-50">
                        <div class="flex justify-between items-center">
                            <span class="text-[10px] font-bold bg-gray-100 px-2 py-0.5 rounded-full text-gray-800">Size ${p.size || ''}</span>
                        </div>
                        <div class="font-bold text-[14px] text-black mt-0.5">${(Number(p.price) || 0).toLocaleString('vi-VN')}đ</div>
                    </div>
                `;
                container.appendChild(div);
            });
        };

        let currentItem = null;
        window.openModal = function(item) {
            currentItem = item;
            document.getElementById('modalImg').src = window.getOptimizedImageUrl(item.imageUrl, 1000);
            document.getElementById('modalSize').innerText = item.size || '';
            document.getElementById('modalPrice').innerText = (Number(item.price) || 0).toLocaleString('vi-VN') + 'đ';
            
            let cmText = "~ Vừa vặn";
            let sNum = parseFloat(item.size);
            if(!isNaN(sNum)) {
                if(sNum === 33 || sNum === 33.5) cmText = "~ 20.5cm - 21cm";
                else if(sNum === 34 || sNum === 34.5) cmText = "~ 21.5cm - 22cm";
                else if(sNum === 35 || sNum === 35.5) cmText = "~ 22cm - 22.5cm";
                else if(sNum === 36) cmText = "~ 22.5cm - 23cm";
                else if(sNum === 36.5 || sNum === 37) cmText = "~ 23cm - 23.5cm";
                else if(sNum >= 37.5 && sNum <= 39) cmText = "~ 24cm - 25cm";
                else if(sNum >= 40 && sNum <= 41) cmText = "~ 25.5cm - 26cm";
                else if(sNum >= 42 && sNum <= 43) cmText = "~ 26.5cm - 27.5cm";
                else if(sNum >= 44) cmText = "~ 28cm+";
            } else if((item.size || '').toLowerCase() === 'kid') {
                cmText = "Size bé < 20cm";
            }
            document.getElementById('modalCmInfo').innerText = cmText;
            
            document.getElementById('orderModal').classList.remove('hidden');
        };

        window.closeModal = function() {
            document.getElementById('orderModal').classList.add('hidden');
        };

        window.submitOrder = async function() {
            const phoneInput = document.getElementById('customerPhone');
            const phone = phoneInput ? phoneInput.value.trim() : '';
            const btn = document.getElementById('btnSubmitOrder');

            if (!phone) { window.showToast('Vui lòng nhập SĐT để Shop liên hệ!'); return; }
            if (!currentItem) { window.showToast('Chưa chọn sản phẩm!'); return; }

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            btn.disabled = true;

            const telegramBotToken = "8968912621:AAFKK2PQuPNqWLLer4_wkZf6PtY1ZzHV9RI";
            const chatId = "8511070091";
            
            // Link Zalo Đã đổi
            const message = `🔥 YÊU CẦU TỪ WEB 🔥\n\n` +
                            `📞 SĐT: ${phone}\n` +
                            `👟 Size: ${currentItem.size || '---'}\n` +
                            `💰 Giá: ${(Number(currentItem.price) || 0).toLocaleString('vi-VN')}đ\n` +
                            `🖼 Ảnh: ${currentItem.imageUrl}\n\n` +
                            `🔗 Nhắn Zalo: https://zalo.me/${phone}`;

            try {
                // Lưu vào CSDL
                await addDoc(collection(db, "orders"), {
                    size: currentItem.size || '',
                    price: Number(currentItem.price) || 0,
                    imageUrl: currentItem.imageUrl,
                    customerName: "Khách web",
                    customerPhone: phone,
                    timestamp: serverTimestamp(),
                    status: 'pending'
                });

                // Gửi Telegram (Sẽ gửi kèm link ảnh)
                try {
                    await fetch(`https://api.telegram.org/bot${telegramBotToken}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_id: chatId, text: message, parse_mode: 'HTML' })
                    });
                } catch (tgErr) {
                    console.warn("Lỗi gửi thông báo Telegram:", tgErr);
                }

                window.showToast("Gửi thành công! Shop sẽ liên hệ bạn ngay.");
                window.closeModal();
                if (phoneInput) phoneInput.value = '';
            } catch (err) {
                console.error("Lỗi gửi đơn:", err);
                window.showToast("Lỗi mạng. Vui lòng thử lại hoặc nhắn tin trực tiếp!");
            } finally {
                btn.innerHTML = 'Gửi';
                btn.disabled = false;
            }
        };

        window.renderFilters();
    </script>
</body>
</html>
